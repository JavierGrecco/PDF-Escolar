name: Tests

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/tests.yml"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/tests.yml"
      - ".github/workflows/build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxcb-image0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - name: Diagnose basic GUI group
        run: |
          python -m pytest -q -rs tests/test_gui_smoke.py::test_main_window_starts_in_a_safe_empty_state tests/test_gui_smoke.py::test_document_card_displays_the_full_pdf_name_and_page_count tests/test_gui_smoke.py::test_page_order_dialog_supports_drag_and_button_reordering
          python -m pytest -q -rs tests/test_gui_smoke.py::test_last_open_directory_uses_a_saved_existing_folder tests/test_gui_smoke.py::test_document_cards_can_be_reordered_by_drop_and_buttons tests/test_gui_smoke.py::test_hidden_page_order_dialog_does_not_start_thumbnail_tasks
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - run: python -m pip install -e ".[dev]"
      - name: Diagnose basic GUI group
        run: |
          python -m pytest -q -rs tests/test_gui_smoke.py::test_main_window_starts_in_a_safe_empty_state tests/test_gui_smoke.py::test_document_card_displays_the_full_pdf_name_and_page_count tests/test_gui_smoke.py::test_page_order_dialog_supports_drag_and_button_reordering
          python -m pytest -q -rs tests/test_gui_smoke.py::test_last_open_directory_uses_a_saved_existing_folder tests/test_gui_smoke.py::test_document_cards_can_be_reordered_by_drop_and_buttons tests/test_gui_smoke.py::test_hidden_page_order_dialog_does_not_start_thumbnail_tasks
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - run: python -m pip install -e ".[dev]"
      - name: Diagnose basic GUI group
        run: |
          python -m pytest -q -rs tests/test_gui_smoke.py::test_main_window_starts_in_a_safe_empty_state tests/test_gui_smoke.py::test_document_card_displays_the_full_pdf_name_and_page_count tests/test_gui_smoke.py::test_page_order_dialog_supports_drag_and_button_reordering
          python -m pytest -q -rs tests/test_gui_smoke.py::test_last_open_directory_uses_a_saved_existing_folder tests/test_gui_smoke.py::test_document_cards_can_be_reordered_by_drop_and_buttons tests/test_gui_smoke.py::test_hidden_page_order_dialog_does_not_start_thumbnail_tasks

  macos-intel:
    name: Tests (macOS Intel / Catalina dependency set)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check code style
        run: python -m ruff check .
      - name: Test PDF engine and application
run: |
          python -m pytest -q -rs tests/test_gui_smoke.py::test_main_window_starts_in_a_safe_empty_state tests/test_gui_smoke.py::test_document_card_displays_the_full_pdf_name_and_page_count tests/test_gui_smoke.py::test_page_order_dialog_supports_drag_and_button_reordering
          python -m pytest -q -rs tests/test_gui_smoke.py::test_last_open_directory_uses_a_saved_existing_folder tests/test_gui_smoke.py::test_document_cards_can_be_reordered_by_drop_and_buttons tests/test_gui_smoke.py::test_hidden_page_order_dialog_does_not_start_thumbnail_tasks
