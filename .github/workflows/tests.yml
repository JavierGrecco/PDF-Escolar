name: Tests

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/tests.yml"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/tests.yml"
      - ".github/workflows/build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxcb-image0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - name: Diagnose GUI shutdown in isolated processes (temporary)
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          tests = [
              "test_main_window_starts_in_a_safe_empty_state",
              "test_document_card_displays_the_full_pdf_name_and_page_count",
              "test_page_order_dialog_supports_drag_and_button_reordering",
              "test_last_open_directory_uses_a_saved_existing_folder",
              "test_document_cards_can_be_reordered_by_drop_and_buttons",
              "test_hidden_page_order_dialog_does_not_start_thumbnail_tasks",
          ]
          failures = []

          def run_case(label, names, cwd=None, extra_env=None):
              command = [
                  sys.executable, "-m", "pytest", "-q", "-rs",
                  *[f"tests/test_gui_smoke.py::{name}" for name in names],
              ]
              environment = os.environ.copy()
              if extra_env:
                  environment.update(extra_env)
              print(f"\\n===== {label} =====", flush=True)
              result = subprocess.run(command, cwd=cwd, env=environment, check=False)
              print(f"===== exit={result.returncode}: {label} =====", flush=True)
              if result.returncode:
                  failures.append((label, result.returncode))

          # Separate processes tell us whether one test crashes by itself.
          for name in tests:
              run_case(f"individual: {name}", [name])

          # Prefixes reveal whether the shutdown failure needs an interaction
          # between tests, and at which step it starts.
          for count in range(2, len(tests) + 1):
              run_case(f"combined prefix: first {count} tests", tests[:count])

          # Re-run the card test and the first three baseline tests against the
          # actual main branch source on this same Ubuntu runner. PYTHONPATH
          # prioritizes that checkout over the editable PR install.
          baseline = Path("/tmp/pdf-escolar-main-baseline")
          fetched = subprocess.run(
              ["git", "fetch", "--no-tags", "origin", "main"], check=False
          )
          if fetched.returncode:
              failures.append(("fetch main baseline", fetched.returncode))
          else:
              checkout = subprocess.run(
                  ["git", "worktree", "add", "--detach", str(baseline), "FETCH_HEAD"],
                  check=False,
              )
              if checkout.returncode:
                  failures.append(("create main baseline worktree", checkout.returncode))
              else:
                  baseline_env = {"PYTHONPATH": str(baseline / "src")}
                  run_case(
                      "main baseline: card test alone",
                      ["test_document_card_displays_the_full_pdf_name_and_page_count"],
                      cwd=baseline,
                      extra_env=baseline_env,
                  )
                  run_case(
                      "main baseline: first three GUI tests",
                      tests[:3],
                      cwd=baseline,
                      extra_env=baseline_env,
                  )

          if failures:
              print("\\nDiagnostic failures:", failures, flush=True)
              raise SystemExit(1)
          print("\\nAll isolated and combined diagnostic runs passed.", flush=True)
          PY
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -rs
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -rs

  macos-intel:
    name: Tests (macOS Intel / Catalina dependency set)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check code style
        run: python -m ruff check .
      - name: Test PDF engine and application
        run: python -m pytest -q -rs
