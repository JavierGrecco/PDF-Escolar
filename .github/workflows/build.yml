name: Build installers

on:
  pull_request:
    paths:
      - "src/**"
      - "tools/**"
      - "packaging/**"
      - "assets/**"
      - ".github/workflows/build.yml"
      - "pyproject.toml"
      - "requirements*.txt"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Versión para publicar (ej. 0.1.0-beta.1). Dejá vacío para generar solo paquetes de prueba."
        required: false
        type: string
      sync_downloads:
        description: "Actualizar también los binarios de descargas/ (solo para un refresco explícito; aumenta el historial de Git)."
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tools/**"
      - "packaging/**"
      - "assets/**"
      - ".github/workflows/build.yml"
      - "pyproject.toml"
      - "requirements*.txt"
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Set package version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $publishBeta = $env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF_NAME -eq "main" -and $env:COMMIT_MESSAGE.Contains("[publish-app-beta]")
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME.StartsWith("v")) {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } elseif (-not [string]::IsNullOrWhiteSpace($env:RELEASE_VERSION)) {
            $version = $env:RELEASE_VERSION
          } elseif ($publishBeta) {
            $version = "0.1.0-beta.1"
          } else {
            $version = "0.1.0-dev.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$') {
            throw 'La versión debe seguir el formato X.Y.Z, por ejemplo 0.1.0-beta.1.'
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Set application display version
        shell: pwsh
        run: |
          Set-Content -Path src/pdf_escolar/_build_version.py -Value "__version__ = '$env:APP_VERSION'" -Encoding utf8

      - name: Install application and packager
        run: python -m pip install -e . pyinstaller

      - name: Generate application icon
        run: python tools/create_icon.py

      - name: Build self-contained Windows application
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name PDF-Escolar --paths src
          --icon assets/pdf-escolar.ico
          --collect-all pikepdf --collect-all pypdfium2 --collect-all PIL
          src/pdf_escolar/__main__.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Create Spanish Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows\PDF-Escolar.iss"'

      - name: Probar instalación, apertura y desinstalación
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem dist -Filter "PDF-Escolar-Instalador-*-Windows.exe" -File | Select-Object -First 1
          $portable = Get-Item "dist/PDF-Escolar.exe"
          if ($portable.Length -lt 1MB) {
            throw "El ejecutable portable de Windows está incompleto."
          }
          if ($null -eq $installer -or $installer.Length -lt 1MB) {
            throw "No se generó un instalador de Windows válido."
          }

          $installDir = Join-Path $env:RUNNER_TEMP "PDF-Escolar-Smoke-Test"
          $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) {
            throw "El instalador de Windows terminó con el código $($installProcess.ExitCode)."
          }

          $installedExe = Join-Path $installDir "PDF-Escolar.exe"
          if (-not (Test-Path $installedExe -PathType Leaf)) {
            throw "La instalación terminó, pero no se encontró PDF-Escolar.exe."
          }

          $appProcess = Start-Process -FilePath $installedExe -PassThru
          Start-Sleep -Seconds 6
          $appProcess.Refresh()
          if ($appProcess.HasExited) {
            throw "PDF Escolar se cerró inesperadamente al iniciarse desde la instalación."
          }
          Get-Process -Name "PDF-Escolar" -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller -PathType Leaf)) {
            throw "La instalación no creó el desinstalador."
          }
          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) {
            throw "El desinstalador terminó con el código $($uninstallProcess.ExitCode)."
          }
          if (Test-Path $installedExe) {
            throw "La desinstalación no quitó el ejecutable instalado."
          }
          Write-Host "Instalación, apertura y desinstalación verificadas."
      - name: Upload Windows downloads
        uses: actions/upload-artifact@v7
        with:
          name: pdf-escolar-windows
          path: |
            dist/PDF-Escolar.exe
            dist/PDF-Escolar-Instalador-*-Windows.exe
          if-no-files-found: error
          retention-days: 90

  macos:
    name: macOS disk image (${{ matrix.arch_label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch_slug: Intel
            arch_label: Intel
            python_version: "3.11"
          - runner: macos-latest
            arch_slug: Apple-Silicon
            arch_label: Apple Silicon
            python_version: "3.12"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Set package version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${RELEASE_VERSION:-}" ]]; then
            version="$RELEASE_VERSION"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == "main" && "${COMMIT_MESSAGE:-}" == *"[publish-app-beta]"* ]]; then
            version="0.1.0-beta.1"
          else
            version="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "La versión debe seguir el formato X.Y.Z, por ejemplo 0.1.0-beta.1." >&2
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set application display version
        shell: bash
        run: printf '__version__ = "%s"\n' "$APP_VERSION" > src/pdf_escolar/_build_version.py

      - name: Install application and packager
        run: python -m pip install -e . pyinstaller

      - name: Generate application icon
        run: python tools/create_icon.py

      - name: Create macOS icon
        shell: bash
        run: |
          mkdir -p assets/pdf-escolar.iconset
          sips -z 16 16 assets/pdf-escolar.png --out assets/pdf-escolar.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 assets/pdf-escolar.png --out assets/pdf-escolar.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 assets/pdf-escolar.png --out assets/pdf-escolar.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 assets/pdf-escolar.png --out assets/pdf-escolar.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 assets/pdf-escolar.png --out assets/pdf-escolar.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 assets/pdf-escolar.png --out assets/pdf-escolar.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 assets/pdf-escolar.png --out assets/pdf-escolar.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 assets/pdf-escolar.png --out assets/pdf-escolar.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 assets/pdf-escolar.png --out assets/pdf-escolar.iconset/icon_512x512.png >/dev/null
          sips -z 1024 1024 assets/pdf-escolar.png --out assets/pdf-escolar.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns assets/pdf-escolar.iconset -o assets/pdf-escolar.icns

      - name: Build self-contained macOS application
        run: >-
          pyinstaller --noconfirm --clean --windowed
          --name PDF-Escolar --paths src
          --icon assets/pdf-escolar.icns
          --collect-all pikepdf --collect-all pypdfium2 --collect-all PIL
          src/pdf_escolar/__main__.py

      - name: Create drag-to-Applications disk image
        shell: bash
        run: |
          mkdir -p dist/dmg-root
          cp -R dist/PDF-Escolar.app dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          cat > dist/dmg-root/LEEME.txt <<'EOF'
          PDF ESCOLAR

          1. Arrastrá PDF Escolar a Aplicaciones.
          2. Abrí la aplicación desde la carpeta Aplicaciones.
          3. No necesitás instalar Python ni abrir Terminal.

          Esta aplicación no está firmada ni notarizada por Apple.
          macOS puede mostrar una advertencia de seguridad al abrirla.
          EOF
          hdiutil create -volname "PDF Escolar" -srcfolder dist/dmg-root -ov -format UDZO "dist/PDF-Escolar-Instalador-$APP_VERSION-macOS-${{ matrix.arch_slug }}.dmg"
          ditto -c -k --sequesterRsrc --keepParent dist/PDF-Escolar.app "dist/PDF-Escolar-macOS-$APP_VERSION-${{ matrix.arch_slug }}.zip"

      - name: Validar el DMG y el contenido de la aplicación
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find dist -maxdepth 1 -type f -name 'PDF-Escolar-Instalador-*-macOS-${{ matrix.arch_slug }}.dmg' -print -quit)"
          zip_file="$(find dist -maxdepth 1 -type f -name 'PDF-Escolar-macOS-*${{ matrix.arch_slug }}.zip' -print -quit)"
          test -n "$dmg"
          test -n "$zip_file"
          hdiutil verify "$dmg"
          unzip -tq "$zip_file"

          mountpoint="$(mktemp -d "${RUNNER_TEMP}/pdf-escolar-dmg.XXXXXX")"
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "$dmg" >/dev/null
          cleanup() {
            hdiutil detach "$mountpoint" -quiet >/dev/null 2>&1 || true
            rmdir "$mountpoint" 2>/dev/null || true
          }
          trap cleanup EXIT

          app="$mountpoint/PDF-Escolar.app"
          plist="$app/Contents/Info.plist"
          test -d "$app"
          test -L "$mountpoint/Applications"
          plutil -lint "$plist"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          executable="$app/Contents/MacOS/$executable_name"
          test -x "$executable"
          architectures="$(lipo -archs "$executable")"
          echo "Arquitecturas del ejecutable: $architectures"
          case "${{ matrix.arch_slug }}" in
            Intel)
              echo "$architectures" | grep -qw x86_64
              ;;
            Apple-Silicon)
              echo "$architectures" | grep -qw arm64
              ;;
            *)
              echo "Arquitectura no reconocida: ${{ matrix.arch_slug }}" >&2
              exit 1
              ;;
          esac
          echo "El DMG se puede montar y contiene una aplicación macOS válida."
      - name: Upload macOS downloads
        uses: actions/upload-artifact@v7
        with:
          name: pdf-escolar-macos-${{ matrix.arch_slug }}
          path: |
            dist/PDF-Escolar-Instalador-*-macOS-${{ matrix.arch_slug }}.dmg
            dist/PDF-Escolar-macOS-*${{ matrix.arch_slug }}.zip
          if-no-files-found: error
          retention-days: 90

  verify-artifacts:
    name: Verify generated installers
    if: github.event_name == 'pull_request'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all generated packages
        uses: actions/download-artifact@v8
        with:
          pattern: pdf-escolar-*
          path: dist
          merge-multiple: true

      - name: Verify expected installers and disk images
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/PDF-Escolar.exe
          test -n "$(find dist -maxdepth 1 -type f -name 'PDF-Escolar-Instalador-*-Windows.exe' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name 'PDF-Escolar-Instalador-*-macOS-Intel.dmg' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name 'PDF-Escolar-Instalador-*-macOS-Apple-Silicon.dmg' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name 'PDF-Escolar-macOS-*-Intel.zip' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name 'PDF-Escolar-macOS-*-Apple-Silicon.zip' -print -quit)"
          ls -lh dist

  publish-release:
    name: Publish downloadable installers
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.release_version != ''
      ) ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        contains(github.event.head_commit.message, '[publish-app-beta]')
      )
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: pdf-escolar-*
          path: dist
          merge-multiple: true

      - name: Determine release version
        id: release
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "${RELEASE_VERSION:-}" ]]; then
            tag="v$RELEASE_VERSION"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == "main" && "${COMMIT_MESSAGE:-}" == *"[publish-app-beta]"* ]]; then
            tag="v0.1.0-beta.1"
          else
            echo "No se pudo determinar la versión para publicar." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/PDF-Escolar.exe
            dist/PDF-Escolar-Instalador-*-Windows.exe
            dist/PDF-Escolar-Instalador-*-macOS-Intel.dmg
            dist/PDF-Escolar-Instalador-*-macOS-Apple-Silicon.dmg
          body: |
            ## Descargas

            - **Windows (portable):** descargá `PDF-Escolar.exe`, hacé doble clic y la aplicación se abre. No instala nada ni requiere Python.
            - **Windows (instalación clásica):** descargá `PDF-Escolar-Instalador-…-Windows.exe` y seguí el asistente en español.
            - **macOS Intel:** descargá el instalador cuyo nombre termina en `macOS-Intel.dmg`.
            - **macOS Apple Silicon (M1/M2/M3/M4):** descargá el instalador cuyo nombre termina en `macOS-Apple-Silicon.dmg`.

            En ambos casos, abrí el archivo `.dmg` y arrastrá PDF Escolar a Aplicaciones.

            No necesitás instalar Python ni abrir Terminal. Los documentos PDF se procesan localmente.

            ### OCR local (beta)

            Esta versión integra un complemento OCR opcional, descargable desde «Herramientas PDF». La primera instalación requiere conexión a Internet; el reconocimiento se ejecuta en el equipo y después funciona sin conexión. Está disponible para Windows x64 y Mac con Apple Silicon (M1 o posterior) y macOS 14 o posterior. No se ofrece OCR para Mac Intel; las otras herramientas PDF siguen disponibles en esos equipos.

            **Aviso para macOS:** si esta versión no ha sido firmada y notarizada por Apple, macOS puede mostrar una advertencia de seguridad. Revisá las notas de la versión antes de instalar.

  sync-downloads:
    name: Guardar instaladores en el repositorio
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        (inputs.sync_downloads == true || inputs.release_version != '')
      ) ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        contains(github.event.head_commit.message, '[publish-app-beta]')
      )
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Descargar los paquetes generados
        uses: actions/download-artifact@v8
        with:
          pattern: pdf-escolar-*
          path: dist
          merge-multiple: true

      - name: Preparar los archivos de descarga
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          mkdir -p descargas

          cp dist/PDF-Escolar.exe descargas/PDF-Escolar.exe

          windows_installer="$(find dist -maxdepth 1 -type f -name 'PDF-Escolar-Instalador-*-Windows.exe' -print -quit)"
          intel_dmg="$(find dist -maxdepth 1 -type f -name 'PDF-Escolar-Instalador-*-macOS-Intel.dmg' -print -quit)"
          apple_dmg="$(find dist -maxdepth 1 -type f -name 'PDF-Escolar-Instalador-*-macOS-Apple-Silicon.dmg' -print -quit)"

          test -n "$windows_installer"
          test -n "$intel_dmg"
          test -n "$apple_dmg"

          cp "$windows_installer" descargas/PDF-Escolar-Instalador-Windows.exe
          cp "$intel_dmg" descargas/PDF-Escolar-macOS-Intel.dmg
          cp "$apple_dmg" descargas/PDF-Escolar-macOS-Apple-Silicon.dmg

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == v* ]]; then
            download_version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${RELEASE_VERSION:-}" ]]; then
            download_version="$RELEASE_VERSION"
          elif [[ "${GITHUB_EVENT_NAME:-}" == "push" && "${GITHUB_REF_NAME:-}" == "main" && "${COMMIT_MESSAGE:-}" == *"[publish-app-beta]"* ]]; then
            download_version="0.1.0-beta.1"
          else
            download_version="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi

          {
            echo "PDF Escolar"
            echo "Versión: $download_version"
            echo "Fecha de compilación (UTC): $(date -u +'%Y-%m-%d %H:%M')"
            echo "Código fuente: $GITHUB_SHA"
            echo "Compilación: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "SHA-256:"
            sha256sum \
              descargas/PDF-Escolar.exe \
              descargas/PDF-Escolar-Instalador-Windows.exe \
              descargas/PDF-Escolar-macOS-Intel.dmg \
              descargas/PDF-Escolar-macOS-Apple-Silicon.dmg
          } > descargas/INFORMACION-DE-DESCARGA.txt

          ls -lh descargas

      - name: Guardar las descargas en main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add descargas/PDF-Escolar.exe descargas/PDF-Escolar-Instalador-Windows.exe descargas/PDF-Escolar-macOS-Intel.dmg descargas/PDF-Escolar-macOS-Apple-Silicon.dmg descargas/INFORMACION-DE-DESCARGA.txt
          if git diff --cached --quiet; then
            echo "Los archivos de descarga ya están actualizados."
          else
            git commit -m "build: actualizar archivos de descarga"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
