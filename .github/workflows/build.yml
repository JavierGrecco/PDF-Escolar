name: Build desktop artifacts

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . pyinstaller
      - name: Build Windows executable
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PDF-Escolar --paths src --collect-all pikepdf --collect-all pypdfium2 --collect-all PIL src/pdf_escolar/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-escolar-windows
          path: dist/PDF-Escolar.exe
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . pyinstaller
      - name: Build macOS application
        run: pyinstaller --noconfirm --clean --windowed --name PDF-Escolar --paths src --collect-all pikepdf --collect-all pypdfium2 --collect-all PIL src/pdf_escolar/__main__.py
      - name: Package application bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/PDF-Escolar.app dist/PDF-Escolar-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-escolar-macos
          path: dist/PDF-Escolar-macOS.zip
          if-no-files-found: error
