name: Repository policy

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  large-files-and-downloads:
    name: Guard large files and official downloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /tools/check_repository_policy.py
          sparse-checkout-cone-mode: false

      - name: Fetch the pull request base tree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 --filter=blob:none origin "$BASE_SHA"

      - name: Check changed paths and blob sizes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/check_repository_policy.py --base "$BASE_SHA" --head HEAD
