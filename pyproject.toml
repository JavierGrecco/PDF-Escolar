[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-escolar"
version = "0.1.0"
description = "Aplicación local para seleccionar y combinar páginas de varios PDF"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Javier Grecco" }]
dependencies = ["PySide6>=6.8,<7", "pikepdf>=9.0,<11"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pyinstaller>=6.10,<7"]

[project.scripts]
pdf-escolar = "pdf_escolar.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
